services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "QudraTech_Dev_2026!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    ports:
      - "5274:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=QudraTechDb;User Id=sa;Password=QudraTech_Dev_2026!;TrustServerCertificate=True"
      Jwt__Secret: "QudraTech-Dev-Secret-Key-Change-In-Production-2026-MinLength32Chars"
      Jwt__Issuer: "QudraTech"
      Jwt__Audience: "QudraTechUsers"
      Jwt__AccessTokenExpiryMinutes: "30"
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ../qudraTech-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5274/api"
    depends_on:
      - backend

volumes:
  sqlserver_data: